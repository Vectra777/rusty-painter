[package]
name = "rusty-painter"
version = "0.0.1"
authors = ["Valentin Belougne <valentin.belougne@gmail.com>"]
edition = "2024"
description = "Native tiled painting playground built with egui."
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.29", features = ["wgpu", "android-native-activity"] }
env_logger = "0.11"
log = "0.4"
rand = "0.9"
rayon = "1.9"
rustc-hash = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
egui_dock = "0.14.0"
wide = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[dev-dependencies]
pollster = "0.4"
criterion = "0.5"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# desktop-only helpers
[target.'cfg(not(target_os = "android"))'.dependencies]
octotablet = "0.1"
rfd = "0.17.2"
# Images on the system clipboard (copy / paste between apps).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.12", features = ["android-native-activity"] }
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"

[package.metadata.android]
package = "io.vectra.rustypainter"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "Rusty Painter"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# Photo library access, to import images (Android has no file dialog
# that reports back to a NativeActivity).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

# Release signing is intentionally NOT committed here. cargo-apk reads
# [package.metadata.android.signing.release] as plain TOML (no env-var
# interpolation), so a real keystore path/password can't live in this
# file without leaking. To build a signed release APK locally, add the
# block below to your own local, uncommitted copy of this file (git
# will show it as a dirty diff, just don't stage/commit it), or sign
# the unsigned APK manually with `apksigner` after `cargo apk build`.
#
# [package.metadata.android.signing.release]
# path = "/path/to/your/release.keystore"
# keystore_password = "..."
# key_alias = "..."
# key_password = "..."

[patch.crates-io]
winit = { path = "vendor-winit" }

[profile.release]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

[features]
# Exposes `bench_api` for `benches/app_bench.rs`; off in normal builds.
bench = []

[[bench]]
name = "app_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "brush_bench"
harness = false

[[bench]]
name = "blend_bench"
harness = false

[[bench]]
name = "tools_bench"
harness = false
