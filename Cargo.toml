[package]
name = "rusty-painter"
version = "0.1.0"
authors = ["Valentin Belougne <valentin.belougne@gmail.com>"]
edition = "2024"
description = "Native tiled painting playground built with egui."
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.29", features = ["wgpu", "android-native-activity"] }
env_logger = "0.11"
log = "0.4"
rand = "0.9"
rayon = "1.9"
rustc-hash = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
wide = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
# TIFF written directly (an ICC profile, CMYK): the version `image` uses.
tiff = "0.10"
crc32fast = "1.5"
# Importing other apps' brushes: deflated ZIP entries (`.bundle` sets),
# PNG text chunks (`.kpp` presets), their XML, Clip Studio's SQLite files.
miniz_oxide = "0.8"
png = "0.18"
# The Text tool: glyph outlines (egui already uses it).
ab_glyph = "0.2"
quick-xml = "0.41"
# Shader layers: GLSL (Shadertoy style) compiled with naga, handed to wgpu
# as naga modules.
naga = { version = "22", features = ["glsl-in"] }
wgpu = { version = "22.1", default-features = false, features = ["naga-ir"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Colour management (ICC profiles, CMYK): Little CMS, built from its source.
lcms2 = { version = "6.2", features = ["static"] }
# SVG brush tips (Krita's), drawn at the size they paint at.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
pollster = "0.4"
criterion = "0.5"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# desktop-only helpers
[target.'cfg(not(target_os = "android"))'.dependencies]
octotablet = "0.1"
rfd = "0.17.2"
# Waiting on rfd's file dialogs off the UI thread.
pollster = "0.4"
# Images on the system clipboard (copy / paste between apps).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Telling an X11 window from a Wayland one (octotablet has no X11 backend).
raw-window-handle = "0.6"

# X11 pen pressure: the patched winit queues the pen's samples.
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "macos", target_os = "ios"))))'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.12", features = ["android-native-activity"] }
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"

[package.metadata.android]
package = "io.vectra.rustypainter"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application]
label = "Rusty Painter"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# Photo library access, to import images (Android has no file dialog
# that reports back to a NativeActivity).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

# Release signing is intentionally NOT committed here. cargo-apk reads
# [package.metadata.android.signing.release] as plain TOML (no env-var
# interpolation), so a real keystore path/password can't live in this
# file without leaking. To build a signed release APK locally, add the
# block below to your own local, uncommitted copy of this file (git
# will show it as a dirty diff, just don't stage/commit it), or sign
# the unsigned APK manually with `apksigner` after `cargo apk build`.
#
# [package.metadata.android.signing.release]
# path = "/path/to/your/release.keystore"
# keystore_password = "..."
# key_alias = "..."
# key_password = "..."

[patch.crates-io]
winit = { path = "vendor-winit" }

[profile.release]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

# Tests run pixel loops over whole canvases: at opt-level 1 they run about
# three times faster for a couple of seconds more compiling.
[profile.test]
opt-level = 1

[features]
default = ["sut-import"]
# Exposes `bench_api` for `benches/app_bench.rs`; off in normal builds.
bench = []
# Importing Clip Studio Paint brushes (.sut, SQLite: builds SQLite from C).
sut-import = ["dep:rusqlite"]

[[example]]
name = "profile_presets"
required-features = ["bench"]

[[bench]]
name = "app_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "brush_bench"
harness = false

[[bench]]
name = "blend_bench"
harness = false

[[bench]]
name = "tools_bench"
harness = false
