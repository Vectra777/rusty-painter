[package]
name = "rusty-painter"
version = "0.0.1"
authors = ["Valentin Belougne <valentin.belougne@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]




[dependencies]
eframe = "0.29"
env_logger = "0.11"
log = "0.4"
rand = "0.9"
rayon = "1.9"
image = "0.25"
egui_dock = "0.14.0"
wide = "0.7"
winit = { version = "0.30.12", features = ["android-native-activity"] }

[dev-dependencies]
criterion = "0.5"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
serde = "1.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# desktop-only helpers
[target.'cfg(not(target_os = "android"))'.dependencies]
octotablet = "0.1"
rfd = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"              # to access the DOM (to hide the loading text)



[profile.release]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

[package.metadata.android]
package_name = "com.vectra.rustypainter"
label = "Rusty Painter"
min_sdk_version = 24
target_sdk_version = 34
fullscreen = true

[[bench]]
name = "brush_bench"
harness = false

[[bench]]
name = "simd_bench"
harness = false
