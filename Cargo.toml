[package]
name = "rusty-painter"
version = "0.0.1"
authors = ["Valentin Belougne <valentin.belougne@gmail.com>"]
edition = "2024"
description = "Native tiled painting playground built with egui."
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = "0.29"
env_logger = "0.11"
log = "0.4"
rand = "0.9"
rayon = "1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
egui_dock = "0.14.0"
wide = "0.7"

[dev-dependencies]
criterion = "0.5"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# desktop-only helpers
[target.'cfg(not(target_os = "android"))'.dependencies]
octotablet = "0.1"
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30.12", features = ["android-native-activity"] }


[profile.release]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

[package.metadata.android]
package_name = "com.vectra.rustypainter"
label = "Rusty Painter"
min_sdk_version = 24
target_sdk_version = 34
fullscreen = true

[[bench]]
name = "brush_bench"
harness = false

[[bench]]
name = "blend_bench"
harness = false
